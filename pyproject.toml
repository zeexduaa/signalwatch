[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "signalwatch"
version = "0.1.0"
description = "Watch market prices and get alerts when your signals fire. Alerts only: it never trades."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Ali" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["alerts", "trading signals", "rsi", "moving average", "discord", "telegram"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
signalwatch = "signalwatch.cli:main"

[project.urls]
Homepage = "https://github.com/zeexduaa/signalwatch"
Issues = "https://github.com/zeexduaa/signalwatch/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
